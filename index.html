<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Beer Cap Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="search-container">
    <input type="text" id="search-input" placeholder="Search breweries or beers...">
    <div id="search-results"></div>
  </div>

  <div id="map"></div>

  <div id="sidebar">
    <div class="sidebar-drag-handle"><span></span></div>
  </div>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox-overlay">
    <div class="lightbox-content">
      <button class="lightbox-close" title="Close">&times;</button>
      <button class="lightbox-nav prev" title="Previous">&#8249;</button>
      <button class="lightbox-nav next" title="Next">&#8250;</button>
      <img class="lightbox-image" src="" alt="Crown cap">
      <div class="lightbox-info">
        <h3 class="lightbox-beer-name"></h3>
        <p class="lightbox-brewery-name"></p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
